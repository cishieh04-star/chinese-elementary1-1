<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>青蛙池塘大冒險・國語一年級第四課〈大個子，小個子〉（第 08 回）</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:56rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:6.9rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:1rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result>.big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- Boss ---------- */
.bosshead{display:flex;align-items:center;gap:.8rem;background:linear-gradient(#ffd6d6,#ffeaea);border-radius:1.2rem;padding:.5rem .9rem;box-shadow:var(--shadow);flex:none}
.bosshead .bossface{font-size:3.2rem}
.powers{display:flex;gap:.5rem;flex:none}
/* ---------- class mode ---------- */
.race{background:linear-gradient(#bfe9ff,#e5f8ff);border-radius:1.2rem;padding:.6rem .8rem;box-shadow:var(--shadow);flex:none}
.rtrack{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.rtrack .tn{width:6rem;font-size:1rem;font-weight:900;flex:none;text-align:right;color:var(--ink)}
.rtrack .lane2{flex:1;height:2.4rem;background:rgba(255,255,255,.7);border-radius:99px;position:relative}
.rtrack .bal{position:absolute;top:-.5rem;font-size:2.4rem;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.tpill{padding:.35rem .9rem;border-radius:99px;color:#fff;font-weight:900;font-size:1.2rem;display:inline-block}
.timerbar{height:.9rem;border-radius:99px;background:#d6e6f7;overflow:hidden;flex:none}
.timerbar i{display:block;height:100%;background:var(--green);transition:background .3s}
.teamcfg{display:flex;gap:.5rem;flex-wrap:wrap}
.teamcfg input{font:inherit;font-weight:800;padding:.4rem .7rem;border-radius:.8rem;border:.15rem solid var(--line);width:9rem;user-select:text}
/* ---------- misc ---------- */
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;background:linear-gradient(#bfe9ff,#bff3b0);border-radius:1.2rem;padding:.8rem;min-height:12rem}
.hut{font-size:2.4rem;text-align:center;line-height:1;position:relative;animation:scr .4s}
.hut::after{content:"🕸️";position:absolute;left:50%;top:-.2rem;transform:translateX(-50%);font-size:1.5rem;opacity:.85}
.cert{width:100%;max-width:40rem;border-radius:1rem;box-shadow:var(--shadow);display:block;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .4rem;text-align:center;box-shadow:0 .2rem 0 #cfdcee;font-size:.85rem;line-height:1.4}
.badge .e{font-size:2.3rem;display:block}
.badge.no{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.95rem}
.bar2 .nm{width:7.5rem;flex:none}
.bar2 .tr{flex:1;height:1.2rem;background:#e3eefb;border-radius:99px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar2 .v{width:4.5rem;text-align:right;flex:none;font-size:.85rem;color:var(--ink2)}
.wb{background:#fff;border-radius:1rem;padding:.7rem .9rem;box-shadow:0 .2rem 0 #cfdcee;margin-bottom:.6rem;font-size:1.05rem;line-height:2.1}
.idcard{background:linear-gradient(#fff,#fff7dc);border:.18rem solid #ffe07a;border-radius:1rem;padding:.6rem .8rem;line-height:1.9}
.idcard b{font-size:1.4rem;color:var(--coral2)}
.idcard.no{opacity:.45;filter:grayscale(1);border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media print{body{overflow:visible}#app{position:static}.hud,.dock,.btn,.tabs{display:none}}

#zyBtn{position:fixed;top:.5rem;right:.6rem;z-index:90;min-width:3.5rem;height:3rem;border-radius:1rem;background:#fff;border:.15rem solid var(--line);box-shadow:0 .25rem 0 #b9cde6;font-weight:900;font-size:.9rem;line-height:1.1;padding:.1rem .5rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
#zyBtn small{font-size:.62rem;letter-spacing:.02rem;color:#d0301f}
#zyBtn.on{background:var(--sun);color:#5a3b00;box-shadow:0 .25rem 0 var(--sun2);border-color:#fff}
#zyBtn:active{transform:translateY(.2rem);box-shadow:none}
.hud,.title-scr{padding-right:4.8rem}
.zy-on .qcard,.zy-on .opt,.zy-on .speech,.zy-on .sheet .body,.zy-on .sheet .ans,.zy-on .inst,.zy-on .sense,.zy-on .brick,.zy-on .ordi,.zy-on .wb,.zy-on .enemy .say,.zy-on .runq,.zy-on .gate .g,.zy-on .sorti,.zy-on .cardc,.zy-on .wtile,.zy-on .idcard,.zy-on .hint{line-height:2.7}
.zy-on .chtile{line-height:2.4;min-width:2.8rem}
.zy-on .pchar,.zy-on .slot{line-height:2.2}
.zy-on .node .nm,.zy-on .node .sk{line-height:2}
.brick .mark{color:#2b3a55}

#go{padding:.7rem .5rem;white-space:nowrap}

.inst>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.inst>span:last-child,.opt>span:last-child,.ordi>span:last-child,.speech>div>div{min-width:0}

.zy-on .gate .g{font-size:1rem;line-height:2.5;padding:.3rem 0}.zy-on .gate .g rt{font-size:.4em}

.opt,.sense,.cardc,.ordi,.brick{overflow-wrap:anywhere;max-width:100%}

.btn{white-space:nowrap}.lanebtns .btn{white-space:normal}

.wtile.zt{font-size:1.1rem}
.wtile.sel{outline:3px solid #ffb300;background:#fff8e1}
.wtile.popped.zt{opacity:.5}

"s": "這場馬⟪拉⟫松比賽⟪開⟫放報名後，有很多⟪人⟫參加。", "src": "七（句子式）"}, {"id": "z7_10", "sec": "七", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "才⟪兩⟫下⟪子⟫，他就⟪找⟫到數學⟪課⟫本了。", "src": "七（句子式）"}, {"id": "b1q1", "sec": "一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "主角想在什麼時候學習游泳？", "opts": ["暑假", "寒假", "過年"], "ans": 0, "why": "短文說：爸爸問我今年暑假有沒有想參加的課程，所以是暑假。", "src": "一（閱讀 1）", "bk": "b1"}, {"id": "b1q2", "sec": "一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下面哪個不是主角選擇這個營隊的原因？", "opts": ["打發時間", "學習游泳", "鍛鍊自己"], "ans": 0, "why": "短文說：運動能鍛鍊身心，還能學會游泳；沒有說是為了打發時間。", "src": "一（閱讀 2）", "bk": "b1"}, {"id": "b2q3", "sec": "一", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小朋友在生態池找到什麼？", "opts": ["🦋 蝴蝶", "🐝 蜜蜂", "🐸 青蛙"], "ans": 2, "why": "短文說：我們還找到一隻大青蛙。", "src": "一（閱讀 3）", "bk": "b2", "pO": 1}, {"id": "b2q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「我」和誰從小就是好朋友？", "opts": ["友美", "爸爸", "老師"], "ans": 0, "why": "短文說：我和友美從小就是好朋友。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b2q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "他們下課時，常一起玩什麼？", "opts": ["跳房子", "盪秋千", "捉迷藏"], "ans": 0, "why": "短文說：常一起開心的玩跳房子。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b3q1", "sec": "二十一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，大個子和小個子可能是什麼關係？", "opts": ["父子", "姐妹", "同學", "師生"], "ans": 2, "why": "課文說他們一起上課、一起玩，所以可能是同學。", "src": "二十一.1", "bk": "b3"}, {"id": "b3q2", "sec": "二十一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，從哪裡可以看出大個子和小個子是同學？", "opts": ["手拉手", "兩個人", "看看找找好開心", "一起上課一起玩"], "ans": 3, "why": "「一起上課一起玩」，說明他們是同學。", "src": "二十一.2", "bk": "b3"}, {"id": "b3q3", "sec": "二十一", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，大個子和小個子會手拉手一起做什麼事？", "opts": ["放風箏", "躲貓貓", "發現校園的新事物", "盪秋千"], "ans": 2, "why": "課文說他們手拉手，左看看，右找找，是在發現校園的新事物。", "src": "二十一.3", "bk": "b3"}, {"id": "b3q4", "sec": "二十一", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，從哪裡可以看出大個子和小個子的感情很好？", "opts": ["左看看，右找找", "兩個人，手拉手", "小個子看到一隻大青蛙", "大個子找到三隻小青蛙"], "ans": 1, "why": "「兩個人，手拉手」，表示他們感情很好。", "src": "二十一.4", "bk": "b3"}, {"id": "b3q5", "sec": "二十一", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，大個子和小個子發現了什麼動物？", "opts": ["小貓", "小鳥", "青蛙", "蝴蝶"], "ans": 2, "why": "課文說：看到一隻大青蛙，找到三隻小青蛙。", "src": "二十一.5", "bk": "b3"}, {"id": "b3q6", "sec": "二十一", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，從哪裡可以看出大個子和小個子都喜歡發現新的事物？", "opts": ["兩個人，手拉手", "一起上課", "一起玩", "看看找找好開心"], "ans": 3, "why": "「看看找找好開心」，表示他們喜歡發現新的事物。", "src": "二十一.6", "bk": "b3"}, {"id": "b3q7", "sec": "二十一", "no": "7", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，這一課主要告訴我們什麼？", "opts": ["大個子和小個子會互相幫助。", "用心觀察就能發現新事物。", "要多和同學一起玩遊戲。", "大個子先找到青蛙。"], "ans": 1, "why": "兩個人用心看、用心找，就發現了新事物。", "src": "二十一.7", "bk": "b3"}, {"id": "b3q8", "sec": "二十一", "no": "8", "k": "mc", "st": ["S10"], "sk": "read", "stem": "課文裡，下面哪一個敘述錯誤？", "opts": ["課文中的主角是大個子和小個子。", "大個子和小個子會一起上課一起玩。", "大個子看到一隻大蝴蝶。", "大個子和小個子會在校園裡尋找新事物。"], "ans": 2, "why": "課文說的是「看到一隻大青蛙」，不是大蝴蝶。", "src": "二十一.8", "bk": "b3"}, {"id": "tfb1", "sec": "四", "no": "1", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，主要在描述大個子和小個子用心觀察，發現了校園的新事物。", "ans": 1, "why": "他們一起看看、找找，發現新事物。", "bk": "b5", "src": "四.1（課文）"}, {"id": "tfb2", "sec": "四", "no": "2", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，大個子和小個子是同學。", "ans": 1, "why": "他們一起上課一起玩，是同學。", "bk": "b5", "src": "四.2（課文）"}, {"id": "tfb3", "sec": "四", "no": "3", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，大個子和小個子不會一起上課。", "ans": 0, "why": "課文說「一起上課一起玩」，所以會一起上課。", "bk": "b5", "src": "四.3（課文）"}, {"id": "tfb4", "sec": "四", "no": "4", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，大個子和小個子會一起去發現新的事物。", "ans": 1, "why": "他們手拉手，左看看，右找找。", "bk": "b5", "src": "四.4（課文）"}, {"id": "tfb5", "sec": "四", "no": "5", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，只有小個子發現青蛙。", "ans": 0, "why": "小個子看到大青蛙，大個子找到三隻小青蛙，兩個人都有發現。", "bk": "b5", "src": "四.5（課文）"}, {"id": "tfb6", "sec": "四", "no": "6", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，大個子和小個子在一起很開心。", "ans": 1, "why": "課文說：看看找找好開心。", "bk": "b5", "src": "四.6（課文）"}, {"id": "tfb7", "sec": "四", "no": "7", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，大個子和小個子的感情不好。", "ans": 0, "why": "他們手拉手，感情很好。", "bk": "b5", "src": "四.7（課文）"}, {"id": "tfb8", "sec": "四", "no": "8", "k": "tf", "st": ["S10"], "sk": "tf", "stem": "課文裡，大個子和小個子在教室裡發現青蛙。", "ans": 0, "why": "課文沒有說在教室裡，他們是在外面找到青蛙。", "bk": "b5", "src": "四.8（課文）"}, {"id": "b4q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "誰看到一隻大青蛙？", "opts": ["哥哥", "我", "爸爸"], "ans": 0, "why": "短文說：哥哥看到一隻大青蛙。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「我」找到了什麼？", "opts": ["三隻小蝌蚪", "一隻大青蛙", "一片荷葉"], "ans": 0, "why": "短文說：我找到三隻小蝌蚪。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "回家以前，哥哥送給「我」什麼？", "opts": ["一片綠綠的荷葉", "一隻小青蛙", "一條魚"], "ans": 0, "why": "短文說：哥哥送給我一片綠綠的荷葉。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "tf01", "sec": "四", "no": "1", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「拉」和「找」兩個字，相同的部分是「扌」。", "ans": 1, "why": "拉和找的左邊，都是「扌」（提手旁）。", "src": "四（是非題）"}, {"id": "tf02", "sec": "四", "no": "2", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「看」和「青」兩個字，相同的部分是「月」。", "ans": 0, "why": "「青」下面有月，「看」下面是目，不一樣。", "src": "四（是非題）"}, {"id": "tf03", "sec": "四", "no": "3", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「子」和「隻」兩個字，都有「ㄗ」的音。", "ans": 0, "why": "「子」讀ㄗˇ，「隻」讀ㄓ，不一樣。", "src": "四（是非題）"}, {"id": "tf04", "sec": "四", "no": "4", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「言＋果」可以組成「課」。", "ans": 1, "why": "言和果合起來，是「課」。", "src": "四（是非題）"}, {"id": "tf05", "sec": "四", "no": "5", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「扌＋立」可以組成「拉」。", "ans": 1, "why": "扌和立合起來，是「拉」。", "src": "四（是非題）"}, {"id": "tf06", "sec": "四", "no": "6", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「扌＋戈」可以組成「我」。", "ans": 0, "why": "扌和戈合起來，是「找」，不是「我」。", "src": "四（是非題）"}, {"id": "tf07", "sec": "四", "no": "7", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「隹＋又」可以組成「誰」。", "ans": 0, "why": "隹和又合起來，是「隻」，不是「誰」。", "src": "四（是非題）"}, {"id": "tf08", "sec": "四", "no": "8", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「虫＋圭」可以組成「蛙」。", "ans": 1, "why": "虫和圭合起來，是「蛙」。", "src": "四（是非題）"}, {"id": "tf09", "sec": "四", "no": "9", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「門＋开」可以組成「問」。", "ans": 0, "why": "門和开合起來，是「開」，不是「問」。", "src": "四（是非題）"}, {"id": "tf10", "sec": "四", "no": "10", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「子」的部首是「一」。", "ans": 0, "why": "「子」的部首是「子」。", "src": "四（是非題）"}, {"id": "tf11", "sec": "四", "no": "11", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「小」的部首是「小」。", "ans": 1, "why": "「小」的部首就是「小」。", "src": "四（是非題）"}, {"id": "tf12", "sec": "四", "no": "12", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「隻」的部首是「又」。", "ans": 0, "why": "「隻」的部首是「隹」。", "src": "四（是非題）"}, {"id": "tf13", "sec": "四", "no": "13", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "一句話還沒說完，可以用「逗號」讓句子停頓一下。", "ans": 1, "why": "逗號「，」表示停頓一下。", "src": "四（是非題）"}, {"id": "tf14", "sec": "四", "no": "14", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "句子說完了，可以用「句號」表示結束。", "ans": 1, "why": "句號「。」表示一句話說完了。", "src": "四（是非題）"}, {"id": "tf15", "sec": "四", "no": "15", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「小朋友」和「鉛筆盒」兩個詞語，都可以用「個」來表示數量。", "ans": 1, "why": "一個小朋友，一個鉛筆盒，都可以用「個」。", "src": "四（是非題）"}, {"id": "tf16", "sec": "四", "no": "16", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「蝴蝶」和「蘋果」兩個詞語，都可以用「隻」來表示數量。", "ans": 0, "why": "蝴蝶是一隻，蘋果是一顆，量詞不一樣。", "src": "四（是非題）"}, {"id": "tf17", "sec": "四", "no": "17", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「青蛙」和「白雲」兩個詞語，都可以用「條」來表示數量。", "ans": 0, "why": "青蛙是一隻，白雲是一朵，都不是「條」。", "src": "四（是非題）"}, {"id": "tf18", "sec": "四", "no": "18", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "在自我介紹時，應該先說問候語「你好！」，再說出對 的「課」，是言字旁。", "src": "十九（字音字形）", "pO": 1, "say": "上「課」的時候，我們要專心聽老師講解。看注音，選出對的字。"}, {"id": "q19_17", "sec": "十九", "no": "17", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "我喜歡吃「⟪青⟫」菜和水果\n看注音，選出對的字。", "opts": ["青", "親", "經", "金"], "ans": 0, "why": "青菜的「青」。", "src": "十九（字音字形）", "pO": 1, "say": "我喜歡吃「青」菜和水果。看注音，選出對的字。"}, {"id": "q19_18", "sec": "十九", "no": "18", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "弟弟「⟪拉⟫」著媽媽的手，不知道要走去哪裡\n看注音，選出對的字。", "opts": ["拉", "千", "位", "立"], "ans": 0, "why": "拉著手的「拉」，是提手旁。", "src": "十九（字音字形）", "pO": 1, "say": "弟弟「拉」著媽媽的手，不知道要走去哪裡。看注音，選出對的字。"}, {"id": "q19_19", "sec": "十九", "no": "19", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "花「⟪開⟫」了，蝴蝶飛來了\n看注音，選出對的字。", "opts": ["門", "悶", "間", "開"], "ans": 3, "why": "花開的「開」。", "src": "十九（字音字形）", "pO": 1, "say": "花「開」了，蝴蝶飛來了。看注音，選出對的字。"}, {"id": "q19_20", "sec": "十九", "no": "20", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "我花了「⟪兩⟫」個小時才完成拼圖\n看注音，選出對的字。", "opts": ["亮", "量", "兩", "語"], "ans": 2, "why": "兩個的「兩」。", "src": "十九（字音字形）", "pO": 1, "say": "我花了「兩」個小時才完成拼圖。看注音，選出對的字。"}, {"id": "q19_21", "sec": "十九", "no": "21", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "小狗「⟪心⟫」情好的時候會一直搖尾巴\n看注音，選出對的字。", "opts": ["興", "心", "型", "醒"], "ans": 1, "why": "心情的「心」。", "src": "十九（字音字形）", "pO": 1, "say": "小狗「心」情好的時候會一直搖尾巴。看注音，選出對的字。"}, {"id": "q19_22", "sec": "十九", "no": "22", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "老師「⟪找⟫」學生幫忙發作業本\n看注音，選出對的字。", "opts": ["早", "找", "炒", "掃"], "ans": 1, "why": "尋找的「找」，是提手旁。", "src": "十九（字音字形）", "pO": 1, "say": "老師「找」學生幫忙發作業本。看注音，選出對的字。"}, {"id": "q19_23", "sec": "十九", "no": "23", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "我「⟪看⟫」見樹上的葉子變黃了\n看注音，選出對的字。", "opts": ["勘", "砍", "看", "着"], "ans": 2, "why": "看見的「看」，上面是手，下面是目。", "src": "十九（字音字形）", "pO": 1, "say": "我「看」見樹上的葉子變黃了。看注音，選出對的字。"}, {"id": "q19_24", "sec": "十九", "no": "24", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "爸爸提醒我，游泳時要戴「⟪蛙⟫」鏡\n看注音，選出對的字。", "opts": ["蛙", "娃", "瓦", "哇"], "ans": 0, "why": "蛙鏡的「蛙」，是蟲字旁。", "src": "十九（字音字形）", "pO": 1, "say": "爸爸提醒我，游泳時要戴「蛙」鏡。看注音，選出對的字。"}, {"id": "q19_25", "sec": "十九", "no": "25", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "地上有好幾「⟪隻⟫」螞蟻在搬運食物\n看注音，選出對的字。", "opts": ["隹", "隻", "枝", "支"], "ans": 1, "why": "一隻、兩隻的「隻」。", "src": "十九（字音字形）", "pO": 1, "say": "地上有好幾「隻」螞蟻在搬運食物。看注音，選出對的字。"}, {"id": "q19_26", "sec": "十九", "no": "26", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "找出「」裡的字，唸起來一樣的一組。", "opts": ["兒「子」、車「子」", "「子」女、房「子」", "「看」家、「看」見", "「看」中、「看」門"], "ans": 0, "why": "兒子、車子的「子」，都讀輕聲 ㄗ˙。", "src": "十九（字音字形）", "pO": 1}, {"id": "q19_27", "sec": "十九", "no": "27", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "找出「子」唸起來和其他三個不一樣的選項。", "opts": ["房「子」", "扇「子」", "鴨「子」", "種「子」"], "ans": 3, "why": "「種子」的「子」讀 ㄗˇ，其他三個都讀 ㄗ˙。", "src": "十九（字音字形）", "pO": 1}, {"id": "q19_28", "sec": "十九", "no": "28", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "工人正在認真的蓋房「⟪子⟫」\n看注音，選出對的字。", "opts": ["了", "仔", "子", "字"], "ans": 2, "why": "房子的「子」。", "src": "十九（字音字形）", "pO": 1, "say": "工人正在認真的蓋房「子」。看注音，選出對的字。"}, {"id": "q19_29", "sec": "十九", "no": "29", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "這「⟪隻⟫」小貓的主人是誰呢\n看注音，選出對的字。", "opts": ["支", "枝", "肢", "隻"], "ans": 3, "why": "一隻小貓的「隻」。", "src": "十九（字音字形）", "pO": 1, "say": "這「隻」小貓的主人是誰呢。看注音，選出對的字。"}, {"id": "q19_30", "sec": "十九", "no": "30", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "多看遠方的「⟪青⟫」色樹木，對眼睛很好\n看注音，選出對的字。", "opts": ["清", "青", "晴", "情"], "ans": 1, "why": "青色的「青」。", "src": "十九（字音字形）", "pO": 1, "say": "多看遠方的「青」色樹木，對眼睛很好。看注音，選出對的字。"}, {"id": "q19_31", "sec": "十九", "no": "31", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "媽媽才剛出門，就有人打電話「⟪找⟫」她\n看注音，選出對的字。", "opts": ["我", "早", "找", "或"], "ans": 2, "why": "找人的「找」，是提手旁。", "src": "十九（字音字形）", "pO": 1, "say": "媽媽才剛出門，就有人打電話「找」她。看注音，選出對的字。"}, {"id": "q19_32", "sec": "十九", "no": "32", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "上「⟪課⟫」要專心，不要一直東張西望\n看注音，選出對的字。", "opts": ["棵", "課", "顆", "刻"], "ans": 1, "why": "上課的「課」。", "src": "十九（字音字形）", "pO": 1, "say": "上「課」要專心，不要一直東張西望。看注音，選出對的字。"}, {"id": "q19_33", "sec": "十九", "no": "33", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "這「⟪兩⟫」枝筆看起來一模一樣\n看注音，選出對的字。", "opts": ["雨", "倆", "兩", "輛"], "ans": 2, "why": "兩枝筆的「兩」。", "src": "十九（字音字形）", "pO": 1, "say": "這「兩」枝筆看起來一模一樣。看注音，選出對的字。"}, {"id": "q19_34", "sec": "十九", "no": "34", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "節目要「⟪開⟫」始了，請你趕快坐好\n看注音，選出對的字。", "opts": ["門", "問", "間", "開"], "ans": 3, "why": "開始的「開」。", "src": "十九（字音字形）", "pO": 1, "say": "節目要「開」始了，請你趕快坐好。看注音，選出對的字。"}, {"id": "q19_35", "sec": "十九", "no": "35", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "他的手錶不見了，「⟪心⟫」裡很著急\n看注音，選出對的字。", "opts": ["心", "必", "芯", "沁"], "ans": 0, "why": "心裡的「心」。", "src": "十九（字音字形）", "pO": 1, "say": "他的手錶不見了，「心」裡很著急。看注音，選出對的字。"}, {"id": "q19_36", "sec": "十九", "no": "36", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "晚餐後，家「⟪人⟫」坐在客廳吃水果\n看注音，選出對的字。", "opts": ["人", "入", "大", "仁"], "ans": 0, "why": "家人的「人」。", "src": "十九（字音字形）", "pO": 1, "say": "晚餐後，家「人」坐在客廳吃水果。看注音，選出對的字。"}, {"id": "q19_37", "sec": "十九", "no": "37", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "好朋友一起「⟪拉⟫」著長線放風箏\n看注音，選出對的字。", "opts": ["位", "拉", "啦", "泣"], "ans": 1, "why": "拉著長線的「拉」，是提手旁。", "src": "十九（字音字形）", "pO": 1, "say": "好朋友一起「拉」著長線放風箏。看注音，選出對的字。"}, {"id": "q19_38", "sec": "十九", "no": "38", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "寫完功課後，我會靜靜的「⟪看⟫」書\n看注音，選出對的字。", "opts": ["目", "貝", "見", "看"], "ans": 3, "why": "看書的「看」。", "src": "十九（字音字形）", "pO": 1, "say": "寫完功課後，我會靜靜的「看」書。看注音，選出對的字。"}, {"id": "q19_39", "sec": "十九", "no": "39", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "找出有錯字的詞語。", "opts": ["上課", "青蛙", "雨個", "開心"], "ans": 2, "why": "「兩個」的「兩」，不是下雨的「雨」。", "src": "十九（字音字形）", "pO": 1}, {"id": "q19_40", "sec": "十九", "no": "40", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "找出沒有錯字的選項。", "opts": ["手拉手", "上棵了", "兩個仁", "好開芯"], "ans": 0, "why": "只有「手拉手」寫對了。", "src": "十九（字音字形）", "pO": 1}, {"id": "q19_41", "sec": "十九", "no": "41", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「那個仁是我的好朋友。」\n找出句子裡的錯字。", "opts": ["個", "仁", "朋", "友"], "ans": 1, "why": "「仁」要改成「人」。", "src": "十九（字音字形）", "pO": 1}, {"id": "q19_42", "sec": "十九", "no": "42", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "找出沒有「人」或「亻」的選項。", "opts": ["你好", "路人", "分開", "他們"], "ans": 2, "why": "「分開」裡面，沒有人，也沒有單人旁。", "src": "十九（字音字形）", "pO": 1}, {"id": "q20_01", "sec": "二十", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「請你□門讓他進來。」\n選一個字，放進空格。", "opts": ["完", "玩", "關", "開"], "ans": 3, "why": "請你「開」門，讓他進來。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_02", "sec": "二十", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我把髒盤□洗一洗。」\n選一個字，放進空格。", "opts": ["了", "小", "子", "人"], "ans": 2, "why": "「盤子」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_03", "sec": "二十", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「這個地方的□吃非常有名。」\n選一個字，放進空格。", "opts": ["小", "大", "上", "下"], "ans": 0, "why": "「小吃」，是各地有名的食物。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_04", "sec": "二十", "no": "4", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「在我難過的時候，家□總是會鼓勵我。」\n選一個字，放進空格。", "opts": ["兩", "人", "心", "青"], "ans": 1, "why": "「家人」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_05", "sec": "二十", "no": "5", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「花園裡，有三□蜜蜂在採花蜜。」\n選一個字，放進空格。", "opts": ["條", "隻", "個", "朵"], "ans": 1, "why": "蜜蜂是動物，要說「三隻」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_06", "sec": "二十", "no": "6", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「天空中飄著好多□白雲。」\n選一個字，放進空格。", "opts": ["朵", "隻", "件", "顆"], "ans": 0, "why": "白雲要說「一朵」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_07", "sec": "二十", "no": "7", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「弟弟送給老師一張卡片，老師□□□，臉上笑咪咪的。」\n選一個答案，放進空格。", "opts": ["好勤勞", "左看看", "好開心", "擦桌子"], "ans": 2, "why": "臉上笑咪咪，是「好開心」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_08", "sec": "二十", "no": "8", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「□□的鐘聲響了，我們要趕快回教室。」\n選一個詞語，放進空格。", "opts": ["吃飯", "上課", "放學", "早上"], "ans": 1, "why": "聽到上課的鐘聲，要趕快回教室。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_09", "sec": "二十", "no": "9", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「那位模特兒□□很高，穿什麼衣服都很好看。」\n選一個詞語，放進空格。", "opts": ["個別", "個性", "個人", "個子"], "ans": 3, "why": "「個子」很高，是說身高。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_10", "sec": "二十", "no": "10", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「媽媽買了我愛吃的蛋糕回來，我好□□。」\n選一個詞語，放進空格。", "opts": ["可愛", "開心", "漂亮", "溫暖"], "ans": 1, "why": "有愛吃的蛋糕，心情「好開心」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_11", "sec": "二十", "no": "11", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我可以和你們□□玩鬼抓人嗎？」\n選一個詞語，放進空格。", "opts": ["起來", "一起", "不是", "不要"], "ans": 1, "why": "「和你們一起玩」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_12", "sec": "二十", "no": "12", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「蜜蜂很□□，每天在花園裡認真的採花蜜。」\n選一個詞語，放進空格。", "opts": ["生氣", "悲傷", "忙碌", "懶惰"], "ans": 2, "why": "每天認真採花蜜，是很「忙碌」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_13", "sec": "二十", "no": "13", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「聽到期待的野餐活動取消，他很□□。」\n找出不適合放進空格的詞語。", "opts": ["開心", "失望", "難過", "傷心"], "ans": 0, "why": "活動取消了，不會「開心」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_14", "sec": "二十", "no": "14", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「過新年，家人在一起真□□。」\n找出不適合放進空格的詞語。", "opts": ["高興", "快樂", "開心", "難過"], "ans": 3, "why": "過新年和家人在一起，不會覺得難過。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_15", "sec": "二十", "no": "15", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出意思差不多的一組。", "opts": ["上課、下課", "開心、高興", "看到、找到", "一起、分開"], "ans": 1, "why": "「開心」和「高興」，意思差不多。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q20_16", "sec": "二十", "no": "16", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出數量詞用錯的選項。", "opts": ["一「個」蝴蝶", "一「個」書包", "一「顆」蘋果", "一「本」畫冊"], "ans": 0, "why": "蝴蝶是動物，要說「一隻蝴蝶」。", "src": "二十（字詞義及運用）", "pO": 0}, {"id": "q23_01", "sec": "二十三", "no": "1", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫最少的字。", "opts": ["子", "小", "人", "心"], "ans": 2, "why": "人 2 畫最少。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_02", "sec": "二十三", "no": "2", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫最少的字。", "opts": ["拉", "青", "兩", "找"], "ans": 3, "why": "找 7 畫，其他都是 8 畫。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_03", "sec": "二十三", "no": "3", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫最多的字。", "opts": ["開", "蛙", "隻", "課"], "ans": 3, "why": "課 15 畫最多。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_04", "sec": "二十三", "no": "4", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫最多的字。", "opts": ["拉", "看", "找", "青"], "ans": 1, "why": "看 9 畫最多。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_05", "sec": "二十三", "no": "5", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫一樣多的兩個字。", "opts": ["拉、看", "蛙、開", "心、子", "兩、找"], "ans": 1, "why": "蛙和開，都是 12 畫。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_06", "sec": "二十三", "no": "6", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫一樣多的兩個字。", "opts": ["看、隻", "開、課", "兩、青", "找、拉"], "ans": 2, "why": "兩和青，都是 8 畫。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_07", "sec": "二十三", "no": "7", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出筆畫不一樣多的兩個字。", "opts": ["兩、看", "子、小", "拉、青", "蛙、開"], "ans": 0, "why": "兩是 8 畫，看是 9 畫，不一樣。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_08", "sec": "二十三", "no": "8", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫，找出和「青」筆畫一樣多的字。", "opts": ["兩", "看", "隻", "找"], "ans": 0, "why": "青和兩，都是 8 畫。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_09", "sec": "二十三", "no": "9", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我們一起看玩遊戲。」\n找出句子裡多餘的字。", "opts": ["們", "一", "起", "看"], "ans": 3, "why": "「看」多餘了，要說「我們一起玩遊戲」。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_10", "sec": "二十三", "no": "10", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「畫圖比賽得獎了，我好是開心。」\n找出句子裡多餘的字。", "opts": ["好", "是", "開", "心"], "ans": 1, "why": "「是」多餘了。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_11", "sec": "二十三", "no": "11", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他看來到一隻大青蛙。」\n找出句子裡多餘的字。", "opts": ["他", "來", "一", "隻"], "ans": 1, "why": "「來」多餘了。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_12", "sec": "二十三", "no": "12", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「老師說上課下課要記得去上廁所。」\n找出句子裡多餘的詞語。", "opts": ["老師", "上課", "下課", "廁所"], "ans": 1, "why": "「上課」多餘了，要說「下課要記得去上廁所」。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_13", "sec": "二十三", "no": "13", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出組成方式和「大個子」一樣的選項。", "opts": ["一起玩", "大大的", "好開心", "小青蛙"], "ans": 3, "why": "「大個子」和「小青蛙」，都是「樣子＋東西」。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_14", "sec": "二十三", "no": "14", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出組成方式和「左看看」一樣的選項。", "opts": ["手拉手", "右找找", "兩個人", "說一說"], "ans": 1, "why": "「左看看」和「右找找」，都是「方向＋動作」。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_15", "sec": "二十三", "no": "15", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出組成方式和「手拉手」一樣的選項。", "opts": ["左看看", "聽一聽", "面對面", "右找找"], "ans": 2, "why": "「手拉手」和「面對面」，都是三個字、用了相同的字。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_16", "sec": "二十三", "no": "16", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出組成方式和其他三個不一樣的選項。", "opts": ["一條圍巾", "一枝鉛筆", "一起上課", "一片餅乾"], "ans": 2, "why": "其他三個都是「一＋量詞＋東西」。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_17", "sec": "二十三", "no": "17", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出順序正確的句子。", "opts": ["上課我們一起。", "一起我們上課。", "我們上課一起。", "我們一起上課。"], "ans": 3, "why": "「我們一起上課。」", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_18", "sec": "二十三", "no": "18", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "找出比較有禮貌、說得完整的自我介紹。", "opts": ["我是王小華。", "你好！我是王小華。", "我是王小華，你是誰？", "你好！我是王小華。我喜歡打球。"], "ans": 3, "why": "先問好、說名字，還說了喜歡做的事，最完整。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q23_19", "sec": "二十三", "no": "19", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "明華把課文的字分成兩堆。\n甲：拉、找、蛙、課\n乙：子、心、看、開\n找出分成兩堆的原因。", "opts": ["把跟「小孩」有關的字放在一起。", "把跟「快樂」有關的字放在一起。", "把「左右兩邊組合的字」放一堆。", "把「上下部分結合的字」放一堆。"], "ans": 2, "why": "甲堆的字，都是左邊和右邊合起來的字。", "src": "二十三（選擇題：其他）", "pO": 0}, {"id": "q24_1", "sec": "二十四", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「你們不要再吵了，媽媽已經想到一個□□□□的辦法了。」\n選一個詞語，放進空格。", "opts": ["兩敗俱傷", "兩全其美", "三心二意", "三三兩兩"], "ans": 1, "why": "「兩全其美」，是兩邊都顧到、都圓滿。", "src": "二十四（生字延伸成語）"}, {"id": "q24_2", "sec": "二十四", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「哥哥□□□□的說，我當選模範生了。」\n選一個詞語，放進空格。", "opts": ["眉開眼笑", "左右開弓", "大開眼界", "愁眉苦臉"], "ans": 0, "why": "當選模範生很高興，要說「眉開眼笑」。", "src": "二十四（生字延伸成語）"}, {"id": "q24_3", "sec": "二十四", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「做事顧全雙方，使兩方面都能圓滿。」\n找出意思是這樣的詞語。", "opts": ["三三兩兩", "三心二意", "兩全其美", "兩敗俱傷"], "ans": 2, "why": "顧全兩邊都圓滿，就是「兩全其美」。", "src": "二十四（生字延伸成語）"}, {"id": "q24_4", "sec": "二十四", "no": "4", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「形容非常高興。」\n找出意思是這樣的詞語。", "opts": ["大開眼界", "左右開弓", "愁眉苦臉", "眉開眼笑"], "ans": 3, "why": "「眉開眼笑」是形容非常高興。", "src": "二十四（生字延伸成語）"}, {"id": "g2_1", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "大青蛙最喜歡坐在哪裡？", "opts": ["荷葉上", "石頭下", "草地裡"], "ans": 0, "why": "短文說：牠最喜歡坐在荷葉上曬太陽。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "池塘邊有一隻大青蛙，牠最喜歡坐在荷葉上曬太陽。"}, {"id": "g2_2", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "誰在家裡煮飯？", "opts": ["媽媽", "爸爸", "小明"], "ans": 0, "why": "短文說：媽媽在家裡煮飯。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小明和爸爸一起去釣魚，媽媽在家裡煮飯。"}, {"id": "g2_3", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小蝌蚪的心情怎麼樣？", "opts": ["很開心", "很難過", "很生氣"], "ans": 0, "why": "牠笑得好開心，心情很開心。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小蝌蚪找到媽媽了，牠笑得好開心。"}, {"id": "g2_4", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "她們最後要去做什麼？", "opts": ["餵小鴨", "看青蛙", "回家"], "ans": 0, "why": "先看青蛙，再餵小鴨，所以最後是餵小鴨。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "姐姐說：我們先去看青蛙，再去餵小鴨。"}, {"id": "g2_5", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "池塘裡現在還有幾隻小青蛙？", "opts": ["兩隻", "一隻", "三隻"], "ans": 0, "why": "有三隻，跳走一隻，還有兩隻。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "池塘裡有三隻小青蛙，跳走了一隻。"}, {"id": "g2_6", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "誰陪我去池塘找青蛙？", "opts": ["哥哥", "媽媽", "老師"], "ans": 0, "why": "短文說：哥哥陪我去池塘找青蛙。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "哥哥陪我去池塘找青蛙，我們都笑了。"}], "books": [{"id": "b1", "title": "小蛙人泳訓營", "src": "一（短文）", "e": "🏊", "paras": ["爸爸問我今年暑假有沒有想參加的課程或營隊。我打開網頁搜尋，找了很多資料，最後看中「小蛙人泳訓營」。", "為什麼選擇這個呢？因為我的身子不太好，運動不只能鍛鍊身心，還能學會游泳，這真是兩全其美的決定。"], "notes": []}, {"id": "b2", "title": "生態池", "src": "一（短文）", "e": "🐸", "paras": ["我和友美從小就是好朋友，下課時，兩個人常一起開心的玩跳房子，也會手拉著手，去生態池看蝌蚪。有一次，我們還找到一隻大青蛙呢！"], "notes": []}, {"id": "b3", "title": "大個子，小個子（課文）", "src": "二十一", "e": "🧑‍🤝‍🧑", "poem": 1, "paras": ["大個子，\n小個子，\n一起上課一起玩。", "大個子，\n小個子，\n兩個人，手拉手，\n左看看，右找找。", "小個子，\n看到一隻大青蛙，\n大個子，\n找到三隻小青蛙。", "小個子，\n大個子，\n看看找找好開心。"], "notes": []}, {"id": "b5", "title": "大個子，小個子（是非）", "src": "四（課文）", "e": "⭕", "poem": 1, "paras": ["大個子，\n小個子，\n一起上課一起玩。", "大個子，\n小個子，\n兩個人，手拉手，\n左看看，右找找。", "小個子，\n看到一隻大青蛙，\n大個子，\n找到三隻小青蛙。", "小個子，\n大個子，\n看看找找好開心。"], "notes": []}, {"id": "b4", "title": "池塘的一天", "src": "補充", "e": "🌿", "paras": ["今天，我和哥哥一起去池塘玩。", "哥哥看到一隻大青蛙，我找到三隻小蝌蚪。", "我們坐在石頭上，看著荷葉上的小蜻蜓。", "回家以前，哥哥送給我一片綠綠的荷葉。"], "notes": []}], "img": {}, "cover": [["一", "國字注音（短文式）＋2 題閱讀", ["z_a1", "z_a2", "z_a3", "z_b1", "z_b2", "z_b3", "zp_a", "zp_b"]], ["二", "改錯字（短文式 2 篇、各 3 個錯字）", ["ty_1", "ty_2"]], ["三", "國字注音（詞語式 25 題）", ["z3_01", "z3_02", "z3_03", "z3_04", "z3_05", "z3_06", "z3_07", "z3_08", "z3_09", "z3_10", "z3_11", "z3_12", "z3_13", "z3_14", "z3_15", "z3_16", "z3_17", "z3_18", "z3_19", "z3_20", "z3_21", "z3_22", "z3_23", "z3_24", "z3_25"]], ["四", "課文是非 8 題（含完整課文）", ["tfb1", "tfb2", "tfb3", "tfb4", "tfb5", "tfb6", "tfb7", "tfb8"]], ["四", "是非題（字形、部首、標點、量詞…18 題）", ["tf01", "tf02", "tf03", "tf04", "tf05", "tf06", "tf07", "tf08", "tf09", "tf10", "tf11", "tf12", "tf13", "tf14", "tf15", "tf16", "tf17", "tf18"]], ["五", "造詞（11 題，改成選出真正的詞語）", [" /* ====== S2 池塘告示牌：國字注音（短文）＋閱讀問答 ====== */
function gRadio(){const its=POOL.S2.filter(id=>IT[id].k==='zp');
  const pid=pickN(its,1)[0],it=IT[pid];
  const P=it.s.replace(/⟪(.)⟫/g,'$1'),zs=zyArr(P);
  const blanks=[];{let j=0;for(let i=0;i<it.s.length;i++){const ch=it.s[i];if(ch==='⟪'){blanks.push({pi:j,c:it.s[i+1]});i+=2;j++}else j++}}
  /* 把長文拆成一小句一小句：電台一次只傳一句 */
  const sents=[];{const re=/[^。？！\n]+[。？！]?/g;let m;while((m=re.exec(P))){sents.push({a:m.index,b:m.index+m[0].length})}}
  sents.forEach(se=>se.bl=blanks.filter(b=>b.pi>=se.a&&b.pi<se.b));
  const k=CNT(blanks.length,5,8);
  /* 每句先各挑一個缺口，再補足 */
  const withB=shuffle(sents.filter(se=>se.bl.length));const chosen=[];
  withB.forEach(se=>{if(chosen.length<k)chosen.push(shuffle(se.bl)[0])});
  let guard=0;while(chosen.length<k&&guard++<50){const c=shuffle(blanks.filter(b=>!chosen.includes(b)))[0];if(!c)break;chosen.push(c)}
  chosen.sort((x,y)=>x.pi-y.pi);
  const rounds=sents.filter(se=>chosen.some(b=>b.pi>=se.a&&b.pi<se.b));
  const nGen=S.len==='std'?3:2;const total=chosen.length+nGen;const {sb}=stageShell('S2',total);window.CURID=pid;
  const nopt=3;
  chosen.forEach(b=>{b.opts=shuffle([b.c].concat(xchars(b.c,nopt-1)))});
  let done=0,failedAny=false;window.TGI={chosen:chosen.map(b=>b.c)};
  const sentHTML=(se,filled)=>{let html='<span class="cl">';for(let j=se.a;j<se.b;j++){const ch=P[j];const bi=chosen.findIndex(b=>b.pi===j);
      if(bi>=0&&!(filled||chosen[bi].done))html+=`<button class="hole" data-b="${bi}"><ruby class="zb"><span class="zbx">　</span><rt>${zs[j]}</rt></ruby></button>`;
      else if(zs[j])html+=`<ruby>${esc(ch)}<rt>${zs[j]}</rt></ruby>`;else html+=esc(ch);
      if((ch==='，'||ch==='─')&&j<se.b-1)html+='</span> <span class="cl">'}return html+'</span>'};
  const plainS=se=>P.slice(se.a,se.b).replace(/\n/g,'');
  function showRound(ri){const se=rounds[ri];let cur=-1;
    const mine=chosen.map((b,i)=>i).filter(i=>chosen[i].pi>=se.a&&chosen[i].pi<se.b);
    sb.innerHTML=progBar()+inst('📜','看注音，點出對的字。','看注音，點出對的字。')+`<div class="radio"><div class="rhead"><span>📜 告示牌 ${ri+1}/${rounds.length}</span><span class="sigs">${chosen.map((b,i)=>`<i id="sg${i}" class="${b.done?'on':''}"></i>`).join('')}</span></div><div class="rmsg big" id="rm">${sentHTML(se)}</div><div class="rkeys" id="rk"></div></div>`;
    setPB(done/total);setProg(done,total);autoSay((ri===0?'先點一個框框，看框框上面的注音，再從下面點出對的字。':'下一塊告示牌。看注音，點出對的字。')+plainS(se));
    const holes=$$('.hole',sb);
    function focus(bi){cur=bi;holes.forEach(h=>h.classList.toggle('act',+h.dataset.b===bi&&!h.classList.contains('okh')));const b=chosen[bi];
      $('#rk',sb).innerHTML=b.opts.map(c=>`<button class="key" data-c="${esc(c)}">${esc(c)}</button>`).join('');
      $$('.key',sb).forEach(kb=>kb.onclick=()=>{if(kb.disabled)return;const b2=chosen[cur];
        if(kb.dataset.c===b2.c){const h=holes.find(x=>+x.dataset.b===cur);h.classList.add('okh');h.classList.remove('act');h.innerHTML=`<ruby>${esc(b2.c)}<rt>${zs[b2.pi]}</rt></ruby>`;sfx('pop');popEl(h,'⭐');$('#sg'+cur,sb).classList.add('on');
          record(pid,!b2.bad,h);done++;setProg(done,total);setPB(done/total);b2.done=1;if(b2.bad)failedAny=true;
          const nx=mine.find(i=>!chosen[i].done);if(nx!==undefined)focus(nx);
          else{$('#rk',sb).innerHTML=`<div class="sigdone">🎉 告示牌補好了！</div>`;sfx('win');later(()=>say('好棒！告示牌補好了。'+plainS(se)),300);later(()=>{if(ri+1<rounds.length)showRound(ri+1);else phase2()},2200)}}
        else{b2.bad=true;kb.disabled=true;kb.classList.add('bad');sfx('bad');toast('不是這個，再看看注音。')}})}
    holes.forEach(h=>h.onclick=()=>{const bi=+h.dataset.b;if(chosen[bi].done)return;focus(bi)});
    focus(mine[0])}
  /* 池塘廣播問答：短文本身就在畫面上，不需要課本 */
  const gen=pickN(POOL.S2.filter(id=>IT[id].gen),S.len==='std'?3:2);

const PSAY={'氵':'三點水','扌':'提手旁','刂':'立刀旁','亻':'單人旁','言':'言字旁','虫':'蟲字旁','隹':'追','圭':'規','门':'門','门':'門','开':'開字裡面的开','立':'站立的立','戈':'戈','又':'又','果':'水果的果','門':'門'};
const partSay=p=>p.split('＋').map(x=>PSAY[x]||x).join('，加，');
function gMatch(){
  const cmpAll=POOL.S3.filter(id=>IT[id].k==='cmp'),mAll=POOL.S3.filter(id=>IT[id].k==='match');

  function matchRound(id,done){const it=IT[id],prs=it.pairs,md=it.mode||'char';let failed=false,sel=null,left=prs.length,T0=0;const gar=shuffle(prs.map(p=>p[1]));window.TGI={id,pairs:prs};

    const car=(p,i)=>{if(md==='char'){const [a,b]=p[0].split('＋');return `<button class="car" data-i="${i}" style="--c:${GCOL[i%6]}"><span class="cb">${T(a)}</span><span class="cp">＋</span><span class="cb">${T(b)}</span></button>`}

        sfx('ok');popEl(g,md==='char'?'拼好了！':'連好了！');if(md==='char'){S.words[right]=1;save()}sel=null;left--;

          const html=md==='char'?prs.map(p=>T(p[0]+'＝'+p[1])).join('　'):md==='word'?prs.map(p=>T(p[0]+p[1])).join('　'):prs.map(p=>T(p[0]+'　和　'+p[1])).join('<br>');

'use strict';
/* ====== S4 蘆葦叢找一找：找出藏著某個部件（或某個注音）的字 ====== */
function gFind(){const n=CNT(POOL.S4.length,5,7),ids=pickN(POOL.S4,n);const {sb}=stageShell('S4',n);
  function round(id,done){const it=IT[id],tl=it.tiles,s=tl?'':it.s,zs=tl?[]:zyArr(s);let failed=false,si=0;
    const tg=it.tg||'山',td=it.tgd||`「${tg}」`,tgs=it.tgsay||tg;
    let segs=[];
    if(tl)segs=[{a:0,b:tl.length,ms:it.marks,req:it.marks.filter(m=>m.req)}];
    else{let a=0;for(let i=0;i<s.length;i++){if('，。！？：；'.includes(s[i])||i===s.length-1){let e=i;while(e+1<s.length&&'」』'.includes(s[e+1]))e++;
        const g={a,b:e+1};g.ms=it.marks.filter(m=>m.i>=g.a&&m.i<g.b);g.req=g.ms.filter(m=>m.req);if(g.req.length)segs.push(g);a=e+1;i=e}}}
    function seg(){const sg=segs[si],last=si===segs.length-1;let segLeft=sg.req.length,wrongs=0;window.TGI={id,marks:sg.ms.map(m=>m.i),req:sg.req.map(m=>m.i)};
      const segText=tl?tl.join('，'):s.slice(sg.a,sg.b).replace(/[\n　]/g,'，');
      const tiles=tl?tl.map((t,i)=>`<button class="sch tt wide" data-i="${i}">${it.noz?esc(t):T(t)}</button>`).join(''):
        [...s.slice(sg.a,sg.b)].map((ch,k)=>{const i=sg.a+k;if(ch==='\n')return'<span class="nl"></span>';
          return isCJK(ch)?`<button class="sch tt" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${ch==='　'?'&emsp;':esc(ch)}</span>`}).join('');
      const ins=tl?it.stem+'。':`點出有${td}的字。`;
      const say0=tl?it.tsay+'這些有：'+segText+'。':`點出有${tgs}的字。`+segText;
      const cnt=()=>tl?`🔍 還有 ${segLeft} 個答案`:`🔍 還有 ${segLeft} 個字有${td}${segs.length>1?`（第 ${si+1}／${segs.length} 段）`:''}`;
      const tip=tl?'不確定的話，點 🔊 聽一聽。':'部件可能在字的旁邊、上面或下面。';
      sb.innerHTML=progBar()+inst('🌾',ins,say0)+`<div class="reeds"><div class="rpatch"><div class="rcount" id="rc">${cnt()}</div><div class="rtxt big tun" id="rt">${tiles}</div></div><div class="wline"><span class="hopper" id="train">🐸</span></div></div><div class="fixbox" id="fx"><div class="hint lt" style="text-align:center">${tip} ${spk(segText)}</div></div>`;
      setPB((ids.indexOf(id)+si/segs.length)/ids.length);autoSay(say0);
      const tlist=$$('.tt',sb);
      tlist.forEach(t=>t.onclick=()=>{if(t.classList.contains('caught'))return;const i=+t.dataset.i,m=it.marks.find(x=>x.i===i);
        if(m){t.classList.add('caught');t.disabled=true;sfx('ok');popEl(t,tl?'答對了！':'有！');S.words[m.c]=1;save();
          if(m.req){segLeft--;$('#rc',sb).textContent=segLeft?cnt():'🎉 都找到了！'}
          if(segLeft<=0){tlist.forEach(x=>x.disabled=true);$('#train',sb).classList.add('go');sfx('win');if(!last)say('好棒！看下一段。');
            if(!last){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">好棒！看下一段 ➜</div>';later(()=>{si++;seg()},1500)}
            else{$('#fx',sb).innerHTML='';record(id,!failed,t);
              let marked,ans;
              if(tl){marked=tl.map((x,k)=>it.marks.some(y=>y.req&&y.i===k)?'⟦'+x+'⟧':x).join('　');ans=it.why}
              else{marked=[...s].map((c,k)=>it.marks.some(x=>x.req&&x.i===k)?'⟦'+c+'⟧':c).join('');const cs=[...new Set(it.marks.filter(x=>x.req).map(x=>x.c))];ans='裡面有'+td+'的字：'+cs.join('、')+'。'}
              const cs2=[...new Set(it.marks.filter(x=>x.req).map(x=>tl?tl[x.i]:x.c))];
              qDone({first:!failed,html:WHYBOX(T(marked),ans),say:(tl?'答案是，':'有'+tgs+'的字，')+cs2.join('，'),onDone:done,delay:900})}}}
        else{failed=true;wrongs++;sfx('bad');t.classList.add('safe');setTimeout(()=>t.classList.remove('safe'),700);toast(tl?'不是這個，再想想。':`這個字沒有${td}，再找找。`);
          if(wrongs>=2){const r=tlist.find(x=>!x.classList.contains('caught')&&sg.req.some(m=>m.i===+x.dataset.i));if(r)r.classList.add('hintg')}}})}
    seg()}
  runRounds(sb,ids,round)}

/* ====== S5 對錯跳跳池：是非題，青蛙跳到「對」或「錯」的荷葉 ====== */
function gHop(){const n=CNT(POOL.S5.length,5,8),ids=pickN(POOL.S5,n);const {sb}=stageShell('S5',n);
  function round(id,done){const it=IT[id];let failed=false,locked=false;window.TGI={id,ans:it.ans};
    const say0=`聽句子。句子是對的，點圈圈；句子是錯的，點叉叉。${plain(it.stem)}`;
    sb.innerHTML=progBar()+inst('🐸','句子對，點⭕。句子錯，點❌。',say0)+`<div class="hopw"><div class="qcard hopc"><div class="qt"><div id="ls">${T(it.stem)}</div></div>${spk(plain(it.stem))}</div><div class="pond2"><button class="pad padt" data-v="1"><b>⭕</b><span>${T('對')}</span></button><button class="pad padf" data-v="0"><b>❌</b><span>${T('錯')}</span></button><div class="hfrog" id="hf">🐸</div></div></div>`;
    setPB(ids.indexOf(id)/ids.length);autoSay(say0);
    const bs=$$('.pad',sb),hf=$('#hf',sb);
    const pick=b=>{if(locked||b.disabled)return;const v=+b.dataset.v;const side=v?'toL':'toR';
      hf.className='hfrog '+side;
      if(v===it.ans){locked=true;b.classList.add('ok');bs.forEach(x=>x.disabled=true);sfx('win');record(id,!failed,b);
        qDone({first:!failed,html:WHYBOX(T(it.stem),(it.ans?'對的！':'錯的！')+(it.why?'<br>'+T(it.why):'')),say:(it.ans?'對的。':'錯的。')+it.why,onDone:done,delay:1000})}
      else{failed=true;sfx('bad');b.classList.add('bad');b.disabled=true;toast('不對喔，再想一想。');later(()=>{if(!locked)hf.className='hfrog'},700)}};
    bs.forEach(b=>b.onclick=()=>pick(b));
    KEYH=e=>{if(e.key==='1')pick(bs[0]);else if(e.key==='2')pick(bs[1])}}
  runRounds(sb,ids,round)}

/* ====== S8 青蛙捉蟲蟲：改錯字、刪掉多餘的字 ====== */
function gSpy(){const all=POOL.S8,ex=all.filter(i=>IT[i].marks.some(m=>m.extra)),lg=all.filter(i=>/^ty_/.test(i)),sh=all.filter(i=>!ex.includes(i)&&!lg.includes(i));
  const std=S.len==='std';const ids=shuffle(pickN(lg,1).concat(pickN(ex,std?2:1),pickN(sh,std?4:3)));const {sb}=stageShell('S8',ids.length);
  function round(id,done){const it=IT[id];const s=it.s,zs=zyArr(s);let failed=false,left=it.marks.length,cur=null;const fixed={};
    /* 一次只看一小段（一個逗號或句號以內），字不會太多 */
    const segs=[];{let a=0;for(let i=0;i<s.length;i++){if('，。！？'.includes(s[i])||i===s.length-1){const ms=it.marks.filter(m=>m.i>=a&&m.i<=i);if(ms.length)segs.push({a,b:i+1,ms});a=i+1}}}
    let si=0;const isEx=it.marks.some(m=>m.extra);
    function seg(){const sg=segs[si];const lastSeg=si===segs.length-1;let segLeft=sg.ms.length;
      window.TGI={id,marks:sg.ms.map(m=>m.i),extra:sg.ms.filter(m=>m.extra).map(m=>m.i)};
      const tiles=[...s.slice(sg.a,sg.b)].map((ch,k)=>{const i=sg.a+k;return isCJK(ch)?`<button class="sch" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${esc(ch)}</span>`}).join('');
      const ins=isEx?'找出多餘的字，點它。':(segs.length>1?`第 ${si+1} 段：找出錯字，點它。`:'找出錯字，點它。');
      const segSay=s.slice(sg.a,sg.b);
      sb.innerHTML=progBar()+inst('🐛',ins,ins)+`<div class="radar"><div class="rcount" id="rc">🐛 還有 ${left} 個${isEx?'多餘的字':'錯字'}${segs.length>1?`（第 ${si+1}／${segs.length} 段）`:''}</div><div class="rtxt big" id="rt">${tiles}</div></div><div class="fixbox" id="fx"><div class="hint lt" style="text-align:center">${isEx?'點出多餘的字':'點出錯字'} ${spk(segSay)}</div></div>`;
      setPB((ids.indexOf(id)+si/segs.length)/ids.length);autoSay(ins+segSay);
      const tilesEl=$$('.sch',sb);
      function oneDone(t,m){left--;segLeft--;$('#rc',sb).textContent=left?`🐛 還有 ${left} 個${isEx?'多餘的字':'錯字'}`:'🎉 都找到了！';cur=null;
        if(segLeft>0){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">好棒！這一段還有，再找找看</div>'}
        else if(!lastSeg){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">這一段找完了！看下一段 ➜</div>';say('這一段找完了。看下一段。');later(()=>{si++;seg()},1500)}
        else{$('#fx',sb).innerHTML='';record(id,!failed,t);
          if(isEx){const mm=it.marks[0];const s2=s.slice(0,mm.i)+s.slice(mm.i+1);
            qDone({first:!failed,html:WHYBOX(T(s2),`多出來的字是「${mm.c}」，把它拿掉，句子就通順了。`),say:'多出來的字是，'+mm.c+'。'+s2,onDone:done,delay:700})}
          else{const txt=it.marks.map(x=>`「${x.c}」→「${x.r}」`).join('　');
            const fixedS=segs.map(g=>[...s.slice(g.a,g.b)].map((c,k)=>fixed[g.a+k]!=null?`⟦${fixed[g.a+k]}⟧`:c).join('')).join('');
            qDone({first:!failed,html:WHYBOX(T(fixedS),'錯字改正：'+txt),say:'改正了，'+it.marks.map(x=>x.r).join('，'),onDone:done,delay:700})}}}
      function showFix(i){const m=it.marks.find(x=>x.i===i);cur=m;tilesEl.forEach(t=>t.classList.toggle('sus',+t.dataset.i===i));
        $('#fx',sb).innerHTML=`<div class="fxh">這是錯字。選出正確的字。 ${spk('這是錯字。選出正確的字。')}</div><div class="chipr">${shuffle(m.opts).map(o=>`<button class="chipb" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
        autoSay('這是錯字。選出正確的字。');
        $$('#fx .chipb',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.dataset.o===m.r){sfx('ok');const t=tilesEl.find(t=>+t.dataset.i===m.i);fixed[m.i]=m.r;t.classList.remove('sus');t.classList.add('caught');t.disabled=true;
            const s2=[...s].map((c,k)=>fixed[k]!=null?fixed[k]:c).join('');const z2=zyArr(s2);t.innerHTML=`<ruby>${esc(m.r)}<rt>${z2[m.i]||''}</rt></ruby>`;popEl(t,'找到了！');
            oneDone(t,m)}
          else{failed=true;b.disabled=true;b.classList.add('bad');sfx('bad');toast('不是這個，再選選看。')}})}
      tilesEl.forEach(t=>t.onclick=()=>{if(t.classList.contains('caught'))return;const i=+t.dataset.i;const m=it.marks.find(x=>x.i===i);
        if(m&&m.extra){sfx('ok');t.classList.add('caught','struck');t.disabled=true;popEl(t,'找到了！');oneDone(t,m)}
        else if(m)showFix(i);
        else{failed=true;sfx('bad');t.classList.add('safe');setTimeout(()=>t.classList.remove('safe'),700);toast('這個字是對的，再找找。')}})}
    seg()}
  runRounds(sb,ids,round)}

/* ====== S7 蓮花池轉轉轉：字詞義 ====== */
function gScope(){const n=CNT(POOL.S7.length,5,6),ids=pickN(POOL.S7,n);const {sb}=stageShell('S7',n);
  function round(id,done){const q=mcq(id),TO=q.pO?TT:T;q.say=q.stem.replace(/\n/g,'，')+optSay(q);let failed=false,locked=false;window.TGI={ans:q.ans};
    const orbit=q.opts.every(o=>[...o].length<=2);const PC=['#bff2a0,#4fae3a','#ffe38a,#e0a800','#ffc2d6,#e0608c','#b8e6ff,#3a9cd0','#d6f5c9,#5cb85c','#fff0b8,#d9a21b'];
    let area;
    if(orbit){const N=q.opts.length,R=N<=2?7:7.6;area=`<div class="orbit" id="ob" style="--R:${R}rem"><div class="ring"></div><div class="spin">${q.opts.map((t,i)=>{const a=Math.round(i*360/N+(N===2?90:45));return `<div class="oslot" style="--a:${a}deg"><button class="pl" data-i="${i}" style="--pc:${PC[i%6].split(',')[0]};--pc2:${PC[i%6].split(',')[1]}"><span>${TO(t)}</span></button></div>`}).join('')}</div><div class="sunc">🌸</div></div><div class="row" style="justify-content:center"><button class="btn w sm" id="pz">⏸ 讓荷葉停下來</button></div>`}
    else area=`<div class="comets">${q.opts.map((t,i)=>`<button class="pl comet" data-i="${i}" style="--pc:${PC[i%6].split(',')[0]};--pc2:${PC[i%6].split(',')[1]};--dl:${i*.5}s"><span class="ck">${LETTERS[i]}</span><span>${TO(t)}</span></button>`).join('')}</div>`;
    sb.innerHTML=progBar()+inst('🌸',orbit?'荷葉在轉。點出正確的答案。':'點出正確的答案。',orbit?'荷葉在轉。點出正確的答案。':'點出正確的答案。')+`<div id="rw">${qCard(q)}${area}</div>`;
    setPB(ids.indexOf(id)/ids.length);autoSay(q.say);
    const btns=$$('.pl',sb);const pz=$('#pz',sb);if(pz)pz.onclick=()=>{const ob=$('#ob',sb);ob.classList.toggle('paused');pz.textContent=ob.classList.contains('paused')?'▶ 讓荷葉轉動':'⏸ 讓荷葉停下來'};
    const pick=i=>{if(locked||btns[i].disabled)return;
      if(i===q.ans){locked=true;btns[i].classList.add('lit');btns.forEach((b,j)=>{b.disabled=true;if(j!==i)b.classList.add('dim')});sfx('win');const ob=$('#ob',sb);if(ob)ob.classList.add('paused');
        const bl=$('.blank',sb);if(bl)bl.innerHTML=T(q.opts[i]);record(id,!failed,btns[i]);
        qDone({first:!failed,html:`<div class="ans">${T('正確答案：'+q.opts[q.ans].replace(/\n/g,' '))}</div>${T(q.why||'')}`,say:q.why,onDone:done,delay:900})}
      else{failed=true;sfx('bad');btns[i].classList.add('nope');btns[i].disabled=true;toast('不是這個，再看看題目。')}};
    btns.forEach((b,i)=>b.onclick=()=>pick(i));
    KEYH=e=>{let i=LETTERS.indexOf(e.key.toUpperCase());if(i<0&&/^[1-4]$/.test(e.key))i=+e.key-1;if(i>=0&&btns[i])pick(i)}}
  runRounds(sb,ids,round)}

'use strict';
/* ====== S9 荷葉小船：照例子，把詞語放進空格，組成短語或句子 ====== */
function gPair(){const all=POOL.S9.filter(i=>IT[i].k==='pair');
  const ids=pickN(all,CNT(all.length,5,7));const {sb}=stageShell('S9',ids.length);
  function round(id,done){const it=IT[id];let failed=false;const filled=it.given.slice();window.TGI={id,bank:it.bank,ans:it.ans};
    const bank=shuffle(it.bank.filter(w=>!it.given.includes(w)));
    const sh=i=>`<span class="pslot ${filled[i]?'full':''}" data-s="${i}">${filled[i]?T(filled[i]):'？'}</span>`;
    const plainLine=()=>it.rows.map(r=>r.map(x=>typeof x==='number'?(filled[x]||'空格'):x).join('')).join('，');
    const sayq=`看例子：${it.ex}。把下面的詞，放進空格，要和例子一樣。這一題：${plainLine()}。可以放的有：${bank.join('，')}。`;
    sb.innerHTML=progBar()+inst('🛶','看例子，把詞放進空格。',sayq)+`<div class="exrow2"><b>例</b>${T(it.ex)} ${spk(it.ex)}</div><div class="boatall" id="ba"><div class="boatw"><div class="boatpicw"><span class="boatem">${it.emo||'🐸'}</span></div><div class="boat" id="bt">${it.rows.map(r=>`<div class="brow">${r.map(x=>typeof x==='number'?sh(x):T(x)).join('')}</div>`).join('')}</div><div class="waves"></div></div><div class="sbricks" id="bk">${bank.map((w,i)=>`<button class="sbrick dish pw" data-w="${esc(w)}" style="--c:${GCOL[i%6]}">${T(w)}</button>`).join('')}</div></div>`;
    setPB(ids.indexOf(id)/ids.length);autoSay(sayq);
    const act=el=>{if(el.disabled)return;const w=el.dataset.w;const i=filled.findIndex((f,k)=>!f&&it.ans[k].includes(w));
      if(i<0){failed=true;sfx('bad');el.classList.add('nope');el.disabled=true;toast(`「${w}」不能放這裡，再試試。`);return}
      filled[i]=w;el.disabled=true;el.classList.add('used');const sl=$$('.pslot',sb)[i];sl.innerHTML=T(w);sl.classList.add('full');sfx('ok');say(w);
      if(filled.every(Boolean)){const txt=plainLine();record(id,!failed,el);$('#bt',sb).classList.add('sail');sfx('win');
        qDone({first:!failed,html:WHYBOX(T(txt),it.why),say:txt,onDone:done,delay:1300})}};
    tapDrag($('#ba',sb),'.pw','.pslot',act)}
  runRounds(sb,ids,round)}

/* ====== S10 池塘圖書角：閱讀測驗 ====== */
function noteMark(i){return String.fromCharCode(0xE000+i)}
function bookHTML(b){const mk=['①','②','③','④','⑤'];
  const para=s=>{let t=s;mk.forEach((m,i)=>{t=t.split(m).join(noteMark(i))});let h=T(t);h=h.replace(/[-]/g,c=>`<button class="nt" data-n="${c.charCodeAt(0)-0xE000}" aria-label="注釋">${mk[c.charCodeAt(0)-0xE000]}</button>`);const say=t.replace(/[-]/g,'').replace(/[\n　]+/g,'，');return`<p>${h}<button class="ibtn sp pbtn" data-say="${esc(say)}" aria-label="讀這一段">🔊</button></p>`};
  const title=T(b.title)+(b.titleNote?`<button class="nt" data-n="0">①</button>`:'');
  return `<h3 class="btitle">${title}</h3>${b.paras.map(para).join('')}<div class="notes hint lt2">${b.notes.map((n,i)=>`<div>${mk[i]} ${T(n)}</div>`).join('')}</div>`}
function bookSay(b){return [b.title].concat(b.paras).join('。').replace(/[①②③④⑤]/g,'').replace(/[　]+/g,'，')}
function gLib(){S.books=S.books||{};const {sb}=stageShell('S10',4);
  const rec=D.books.find(b=>!S.books[b.id])||D.books[0];
  sb.innerHTML=inst('📖','選一篇文章來讀。','選一篇文章來讀。讀完，再回答問題。')+`<div class="shelf">${D.books.map(b=>`<button class="bookc ${b.id===rec.id?'rec':''}" data-b="${b.id}"><span class="be">${b.e}</span><span class="bt2">${T(b.title)}</span><span class="bs">${S.books[b.id]?'✅ 讀過了':(b.id===rec.id?'⭐ 推薦':'')}</span></button>`).join('')}</div>`;
  $$('.bookc',sb).forEach(c=>c.onclick=()=>{sfx('pop');read(bookOf(c.dataset.b))});
  function read(b){const qids=D.items.filter(i=>i.bk===b.id&&(!i.lesson||S.lesq)).map(i=>i.id);window.CURID=qids[0];window.TGI={book:b.id,qids};
    sb.innerHTML=`<div class="bookv" id="bv">${bookHTML(b)}</div><div class="notebub" id="nbb" hidden></div><div class="dockbar"><button class="btn b" id="lis">🔊 聽故事</button><button class="btn g big" id="go2">▶ 讀完了，開始答題</button></div>`;
    const bub=$('#nbb',sb);$$('.nt',sb).forEach(n=>n.onclick=()=>{const i=+n.dataset.n,t=b.notes[i];bub.hidden=false;bub.innerHTML=`<b>${['①','②','③','④','⑤'][i]}</b> ${T(t)} ${spk(t)}`;sfx('pop')});
    $('#lis',sb).onclick=()=>say(bookSay(b),null,true);if(S.auto&&S.tts)later(()=>say('讀一讀這篇文章。想聽的話，按聽故事。讀完了，按綠色的按鈕。'),400);
    $('#go2',sb).onclick=()=>{stopSay();ask(b,qids)}}
  function ask(b,qids){let i=0;const next=()=>{if(i>=qids.length){S.books[b.id]=1;save();endStage({extra:`<div class="row" style="justify-content:center"><button class="btn b" id="lib2">📖 換一本書</button></div>`});later(()=>{const x=$('#lib2');if(x)x.onclick=gLib},60);return}
      setProg(i,qids.length);const q=mcq(qids[i]);q.ctx=null;q.say=(q.say||q.stem.replace(/\n/g,'，'))+optSay(q);window.CURID=qids[i];
      sb.innerHTML=progBar()+`<div class="row" style="justify-content:flex-end"><button class="btn w sm" id="again">📖 再看一次故事</button></div><div id="qh"></div>`;setPB(i/qids.length);
      $('#again',sb).onclick=()=>modal(`<div class="bookv small">${bookHTML(b)}</div><div class="row"><button class="btn g" id="cl">關起來</button></div>`,{silent:1}).el.querySelector('#cl').onclick=function(){this.closest('.modalbg').remove()};

/* ====== 排序造句共用：S6 排排荷葉路 ====== */
const CODES=['①','②','③','④','⑤','⑥'];
function orderRound(sb,ids,id,it,done){const ch=it.chunks;let placed=[],failed=false;window.TGI={id,ord:it.ord};
  const em='🍃',cn='荷葉',first='第一片';
  const instT='點下面的詞，排成一句話。',instS='先點第一個詞，再點下一個詞，排成一句話。';
  function orderStep(){
    const draw=()=>{sb.innerHTML=progBar()+inst(em,instT,instS)+(it.intro?`<div class="introq">${T(it.intro)} ${spk(it.intro)}</div>`:'')+(it.prefix?`<div class="target">${T(it.prefix)}（　　　）${it.end||'。'}</div>`:'')
      +`<div class="station lily"><div class="slotsr">${ch.map((c,i)=>`<button class="slotb ${placed[i]!=null?'full':''}" data-p="${i}"><small>第 ${i+1} 片</small>${placed[i]!=null?`<span>${T(ch[placed[i]])}</span>`:'<span class="q">？</span>'}</button>`).join('')}</div></div><div class="hint lt" style="text-align:center">點一個詞，它就跳到下一片荷葉。點荷葉可以拿回來。</div><div class="sbricks tiles">${ch.map((c,i)=>`<button class="sbrick tile" data-i="${i}" ${placed.includes(i)?'disabled':''} style="--c:${GCOL[i%6]}"><b class="cd">${CODES[i]}</b>${T(c)}</button>`).join('')}</div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('.tile',sb).forEach(t=>t.onclick=()=>{if(t.disabled)return;placed.push(+t.dataset.i);sfx('pop');if(placed.length===ch.length)check();else draw()});
      $$('.slotb',sb).forEach(sl=>sl.onclick=()=>{const p=+sl.dataset.p;if(placed[p]==null)return;placed=placed.slice(0,p);sfx('tick');draw()})};
    const check=()=>{draw();const ok=placed.every((x,i)=>x===it.ord[i]);
      if(ok){sfx('win');record(id,!failed,sb);say(it.std.replace(/[「」]/g,''));qDone({first:!failed,html:WHYBOX(T(it.std)+`<div class="hint">答案：${it.ord.map(i=>CODES[i]).join('')}</div>`,it.why),say:it.std.replace(/[「」]/g,''),onDone:done,delay:900})}
      else{failed=true;sfx('bad');$$('.slotb',sb).forEach((s,i)=>s.classList.add(placed[i]===it.ord[i]?'good':'wrong'));toast('順序不對，再試試看。');later(()=>{placed=[];draw()},1100)}};
    draw();autoSay((it.intro?it.intro.replace(/[。？！\s]+$/,'')+'。':'')+'點下面的詞，一個一個排成句子。點一個詞，它會跳到下一片荷葉。點荷葉可以拿回來。可以排的有：'+ch.join('；')+'。')}
  if(it.pre){const q=MQ(it.pre.q,it.pre.opts,it.pre.ans,it.pre.why,{pO:0});q.id=id;q.sk='sent';q.say=it.pre.q+optSay(q);
    sb.innerHTML=progBar()+'<div id="qh"></div>';setPB(ids.indexOf(id)/ids.length);
    renderMCQ($('#qh',sb),q,{retry:true,norec:true,onAnswer:first=>{if(!first)failed=true},onDone:()=>orderStep()})}
  else orderStep()}
function gCoaster(){const ids=pickN(POOL.S6,CNT(POOL.S6.length,5,5));const {sb}=stageShell('S6',ids.length);
  runRounds(sb,ids,(id,done)=>orderRound(sb,ids,id,IT[id],done))}

/* ====== S11 踩石頭過小河：用詞語造句（疊石頭）＋ 幫句子放標點 ====== */
function gBricks(){const std=S.len==='std';
  const sn=POOL.S11.filter(i=>IT[i].k==='sent'),pu=POOL.S11.filter(i=>IT[i].k==='punct');
  const a=pickN(sn,std?3:2),b=pickN(pu,std?4:3);const ids=[];for(let k=0;k<Math.max(a.length,b.length);k++){if(a[k])ids.push(a[k]);if(b[k])ids.push(b[k])}
  const {sb}=stageShell('S11',ids.length);
  function sentRound(id,it,done){let placed=[],failed=false,hinted=false;const bank=shuffle(it.toks.concat(it.dis).map((t,i)=>({t,i})));window.TGI={id,toks:it.toks,dis:it.dis};
    const draw=()=>{const pre=(()=>{let n=0;while(n<placed.length&&placed[n].t===it.toks[n])n++;return n})();
      sb.innerHTML=progBar()+inst('🐸',`用「${it.w}」造句：照順序點石頭。`,`用${it.w}造句。照順序，一個一個點石頭，排成一句話。`)+`<div class="target">造句詞語：<b>${T(it.w)}</b></div><div class="station river"><div class="floors" id="fl">${placed.length?placed.map((p,k)=>`<button class="sbrick placed" data-k="${k}" style="--c:${GCOL[p.i%6]}">${T(p.t)}</button>`).join(''):'<div class="hint lt">點下面的石頭，排在這裡</div>'}</div></div><div class="sbricks" id="bk">${bank.map(b=>`<button class="sbrick ${placed.some(p=>p.i===b.i)?'used':''} ${hinted&&!placed.some(p=>p.i===b.i)&&b.t===it.toks[pre]?'glow':''}" data-i="${b.i}" ${placed.some(p=>p.i===b.i)?'disabled':''} style="--c:${GCOL[b.i%6]}">${T(b.t)}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn w sm" id="rs">🔄 重來</button><button class="btn p sm" id="ht">💡 提示</button></div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('#bk .sbrick',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;placed.push(bank.find(x=>x.i===+b.dataset.i));hinted=false;sfx('pop');if(placed.length===it.toks.length)check();else draw()});
      $$('.placed',sb).forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.k,1);sfx('tick');draw()});
      $('#rs',sb).onclick=()=>{placed=[];draw()};$('#ht',sb).onclick=()=>{failed=true;hinted=true;draw();toast('亮亮的石頭，是下一塊！')}};
    const check=()=>{const ok=placed.every((p,i)=>p.t===it.toks[i]);
      if(ok){draw();$$('.placed',sb).forEach(b=>b.classList.add('shine'));sfx('win');confetti(14);record(id,!failed,sb);S.sents.push({pat:it.w,text:it.std});if(S.sents.length>60)S.sents.shift();save();say(it.std);
        qDone({first:!failed,html:WHYBOX(T(it.std),`這是老師的示範句。你也可以用「${it.w}」想一個自己的句子，說給大家聽！`),say:it.std,onDone:done,delay:1000,force:false})}
      else{failed=true;sfx('bad');draw();let k=0;while(k<placed.length&&placed[k].t===it.toks[k])k++;const el=$$('.placed',sb)[k];if(el)el.classList.add('wrong');toast(`第 ${k+1} 塊不對，再試試。`);later(()=>{placed=placed.slice(0,k);draw()},1200)}};
    draw();autoSay(`用${it.w}造句。照順序點石頭。可以用的石頭有：${bank.map(b=>b.t).join('，')}。`)}
  function punctRound(id,it,done){const ns=it.ans.length;let k=0,failed=false;const put=Array(ns).fill(null);window.TGI={id,ans:it.ans};
    const full=()=>it.parts.map((p,i)=>p+(i<ns?put[i]||'':'')).join('');
    const draw=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ${put[i]?'ok':i===k?'act':''}">${put[i]?put[i]:'？'}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️','話還沒說完，點「，」。話說完了，點「。」','話還沒說完，點逗號。話說完了，點句號。')+`<div class="station river punctw"><div class="ptxt">${body}</div></div><div class="pbtns"><button class="pk" data-p="，"><b>，</b><span>${T('逗號')}</span></button><button class="pk" data-p="。"><b>。</b><span>${T('句號')}</span></button></div>`;
      setPB((ids.indexOf(id)+k/ns)/ids.length);
      const sayStep=(first)=>autoSay((first?'話還沒說完，點逗號。話說完了，點句號。':'')+`看第${k+1}個空格。前面是：${it.parts[k]}。${it.parts[k+1]?'後面是：'+it.parts[k+1]+'。':'後面沒有字了。'}點逗號，還是點句號？`);
      sayStep(k===0&&put.every(x=>!x));
      $$('.pk',sb).forEach(b=>b.onclick=()=>{const c=b.dataset.p;
        if(it.ans[k].includes(c)){put[k]=c;sfx('ok');k++;if(k>=ns){draw2()}else draw()}
        else{failed=true;sfx('bad');b.classList.add('bad');toast(`這裡不是${c==='，'?'逗號':'句號'}，再試試。`);later(()=>b.classList.remove('bad'),500)}})};
    const draw2=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ok">${put[i]}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️','標點都放好了！','標點都放好了')+`<div class="station river punctw"><div class="ptxt">${body}</div></div>`;setPB((ids.indexOf(id)+1)/ids.length);sfx('win');
      record(id,!failed,sb);const txt=full();say(txt);
      qDone({first:!failed,html:WHYBOX(T(txt),'逗號「，」表示話還沒說完，要停一下；句號「。」表示一句話說完了。'),say:txt,onDone:done,delay:1000})};
    draw()}
  runRounds(sb,ids,(id,done)=>{const it=IT[id];if(it.k==='punct')punctRound(id,it,done);else sentRound(id,it,done)})}

'use strict';
function mixIds(n){const ks=Object.keys(SK);const out=[];let g=0,guard=0;
  while(out.length<n&&guard++<400){const k=ks[g%ks.length];const id=pickN(ALLIDS[k].filter(x=>!out.includes(x)&&mcq(x)),1)[0];if(id)out.push(id);g++}return shuffle(out)}
function gBoss(){quizRun({stage:'S12',ids:mixIds(NQ(10)),title:'🐊 池塘大鱷魚',hearts:5,boss:true})}
function quizRun(o){const N=o.ids.length;if(!N){toast('目前沒有可以練習的題目');return notebook('wrong')}
  startSession(o.stage,o.hearts||0);const el=go(`${hudHTML({title:o.title,hearts:!!o.hearts,prog:'0/'+N})}<div class="stagebody" id="sb"></div>`,'stage');bindBack();const sb=$('#sb',el);
  let i=0,hint=2,coil=2;
  function next(){if(SES.max&&SES.hearts<=0)return endStage({dead:true});if(i>=N)return endStage({extra:o.boss?'<div class="card" style="max-width:26rem">🐊 大鱷魚認輸了，變成一隻小青蛙！大家為你歡呼！🐸</div>':''});
    setProg(i,N);const q=mcq(o.ids[i]);q.say=qSay(q);
    sb.innerHTML=(o.boss?`<div class="bosshead"><div class="bossface" id="bf">${i>=N-1?'🐲':'🐊'}</div><div style="flex:1"><div style="font-weight:900">${T('大鱷魚')}　${T('體力')}</div><div class="hpbar" style="max-width:none"><i id="hp" style="width:${(N-i)/N*100}%"></i></div></div></div>`:progBar())+`<div class="powers"><button class="btn p sm" id="pc" ${coil?'':'disabled'}>🛡️ 刪去 2 個×${coil}</button><button class="btn b sm" id="ph" ${hint?'':'disabled'}>🔍 提示 ×${hint}</button></div><div class="hint" id="th" style="min-height:1.6rem"></div><div id="qh"></div>`;
    if(!o.boss)setPB(i/N);
    const h=renderMCQ($('#qh',sb),q,{retry:!!o.retry,onAnswer:ok=>{if(ok){const bf=$('#bf');if(bf)bf.classList.add('hit');const hp=$('#hp');if(hp)hp.style.width=((N-i-1)/N*100)+'%';if(o.boss){popEl($('#bf'),'🐸 青蛙跳擊！')}}else{loseHeart();const bf=$('#bf');if(bf)bf.classList.add('atk')}},onDone:()=>{i++;next()}});
    $('#pc').onclick=()=>{if(!coil)return;if(h.remove2()){coil--;$('#pc').textContent='🛡️ 刪去 2 個×'+coil;if(!coil)$('#pc').disabled=true;sfx('pop')}};
    $('#ph').onclick=()=>{if(!hint)return;hint--;$('#ph').textContent='🔍 提示 ×'+hint;if(!hint)$('#ph').disabled=true;$('#th').innerHTML='💡 '+T(q.tip||'仔細讀題目，把每個選項讀一讀。');sfx('pop')}}
  next()}

/* ====== 全班青蛙競跳 ====== */
const CL={teams:3,names:['第一組','第二組','第三組','第四組'],n:10,sec:0,types:{}};Object.keys(SK).forEach(k=>CL.types[k]=1);
const TCOL=['#e04848','#1f78e0','#22a653','#9b6bff'];
function classSetup(){
  const el=go(`${hudHTML({title:'🐸 全班池塘競賽',back:true,pg:true})}<div class="page"><div class="wrap"><div class="card"><h3>分組</h3><div class="seg" id="tn">${[2,3,4].map(n=>`<button data-v="${n}" class="${CL.teams===n?'on':''}">${n} 組</button>`).join('')}</div><div class="teamcfg" style="margin-top:.6rem" id="tc"></div></div>
  <div class="card"><h3>題目類型</h3><div class="chips" id="ty">${Object.keys(SK).map(k=>`<button class="tab ${CL.types[k]?'on':''}" data-k="${k}">${SK[k].e} ${SK[k].n}</button>`).join('')}</div></div>
  <div class="card"><div class="sw"><div>題數</div><div class="seg" id="qn">${[6,10,15].map(n=>`<button data-v="${n}" class="${CL.n===n?'on':''}">${n} 題</button>`).join('')}</div></div><div class="sw"><div>每題時間</div><div class="seg" id="qs">${[[0,'不限'],[20,'20 秒'],[30,'30 秒'],[45,'45 秒']].map(([v,n])=>`<button data-v="${v}" class="${CL.sec===v?'on':''}">${n}</button>`).join('')}</div></div></div>
  <div class="hint" style="margin-bottom:.6rem">${T('玩法：各組輪流回答。答對的組別，小青蛙就往前跳一格；先跳到對岸的荷花、或題目結束時跳最遠的組別獲勝！每題答完都會顯示解析，老師可以順便講解。可用鍵盤 1～4 或 A～D 選答案。答題不會計入個人學習紀錄。')}</div>
  <div class="row" style="justify-content:center"><button class="btn g big" id="st">🐸 開始比賽</button></div></div></div>`,'stage');
  bindBack(hub);
  const drawT=()=>{$('#tc',el).innerHTML=Array.from({length:CL.teams},(_,i)=>`<label class="tpill" style="background:${TCOL[i]}">🐸<input data-i="${i}" value="${esc(CL.names[i])}" maxlength="6" style="width:6rem;margin-left:.3rem"></label>`).join('');$$('#tc input',el).forEach(x=>x.oninput=()=>{CL.names[+x.dataset.i]=x.value.trim()||('第'+(+x.dataset.i+1)+'組')})};drawT();
  const seg=(id,key,cb)=>$$('#'+id+' button',el).forEach(b=>b.onclick=()=>{CL[key]=+b.dataset.v;$$('#'+id+' button',el).forEach(x=>x.classList.toggle('on',x===b));if(cb)cb()});
  seg('tn','teams',drawT);seg('qn','n');seg('qs','sec');
  $$('#ty button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;const cnt=Object.values(CL.types).filter(Boolean).length;if(CL.types[k]&&cnt<=1){toast('至少要選一種題型');return}CL.types[k]=CL.types[k]?0:1;b.classList.toggle('on',!!CL.types[k])});
  $('#st').onclick=()=>{getAC();classPlay()}}
function classPlay(){
  const pool=shuffle([].concat(...Object.keys(CL.types).filter(k=>CL.types[k]).map(k=>ALLIDS[k]))).filter(id=>mcq(id));
  const ids=pool.slice(0,CL.n);
  const N=ids.length,T_=CL.teams,teams=Array.from({length:T_},(_,i)=>({n:CL.names[i],c:TCOL[i],s:0}));let i=0,tm=null;

  function next(){if(i>=N)return finish();setProg(i,N);const t=teams[i%T_],q=mcq(ids[i]);q.say='輪到'+t.n+'。'+qSay(q);
    sb.innerHTML=race()+`<div style="text-align:center"><span class="tpill" style="background:${t.c}">🎯 輪到：${esc(t.n)}</span></div>${CL.sec?'<div class="timerbar"><i id="tb" style="width:100%"></i></div>':''}<div id="qh"></div>`;
    const h=renderMCQ($('#qh'),q,{norec:true,tag:true,noauto:false,onAnswer:ok=>{if(tm)tm();if(ok){t.s++;const b=$('#bal'+(i%T_));if(b)b.style.left=(4+t.s/N*88)+'%';sfx('win')}},onDone:()=>{i++;if(teams.some(x=>x.s>=N))i=N;next()}});

  function finish(){const rk=teams.slice().sort((a,b)=>b.s-a.s);const top=rk[0].s;S.cls++;saveNow();checkBadges();sfx('win');confetti(40);
    sb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">🏆</div><h2>比賽結束！</h2>${rk.map((t,k)=>`<div class="tpill" style="background:${t.c};margin:.2rem;font-size:${1.6-k*.1}rem">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(t.n)}　${t.s} 分${t.s===top?'　👑':''}</div><br>`).join('')}<div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn w" id="mp">🗺️ 回池塘地圖</button><button class="btn g big" id="ag">🔁 再比一場</button><button class="btn b" id="cf">⚙️ 重新設定</button></div></div>`;
    $('#mp').onclick=hub;$('#ag').onclick=classPlay;$('#cf').onclick=classSetup}
